version: '3.9'

services:
  db:
    image: mysql:8.4
    container_name: medicareplus-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medicareplus_db
      MYSQL_USER: medicareplus
      MYSQL_PASSWORD: medicareplus
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./medicareplus-backend
      dockerfile: Dockerfile
    container_name: medicareplus-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: medicareplus_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./medicareplus-frontend
      dockerfile: Dockerfile
    container_name: medicareplus-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
